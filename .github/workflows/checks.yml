name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pet
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: pet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pet -d pet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pet:local_dev_only@localhost:5432/pet_test
      API_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app migrations tests
      - run: pytest -q
