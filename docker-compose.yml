services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: pet_finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet -d pet_finance"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
